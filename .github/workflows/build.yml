on:
    workflow_call:
      inputs:
        forRelease:
          description: "Run for release?"
          required: true
          type: boolean

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Git Semantic Version
        id: version
        uses: PaulHatch/semantic-version@5ae1354e589c5a67345fb2c6e65b025ff676d7c7 # v6.0.7
        with:
          tag_prefix: ""
          version_format: "${major}.${minor}.${patch}${{ !inputs.forRelease && '-preview${increment}' || '' }}"
          search_commit_body: true

      - name: Setup dotnet from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format --verify-no-changes

      - name: Build and Pack
        run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version}}

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: "**/*.nupkg"
